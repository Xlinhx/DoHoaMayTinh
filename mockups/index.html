<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLAW LAB — Máy gắp thú</title><style>

ook_at": [0.14, 0.06, 0.88], "ortho": 0.55, "state": "lower", "isolate": "claw"}, {"id": "08-claw-grip", "title": "Càng khép / cùng mesh", "group": "mechanism", "camera": [0.7, -0.8, 1.3], "look_at": [0.14, 0.06, 0.88], "ortho": 0.55, "state": "grip", "isolate": "claw"}, {"id": "09-prize", "title": "Vật phẩm mẫu / chưa chốt nhân vật", "group": "mechanism", "camera": [0.46, -0.5, 1.02], "look_at": [0.14, 0.06, 0.762], "ortho": 0.32, "state": "aim", "isolate": "prize"}, {"id": "10-aim", "title": "01 / Căn vị trí", "group": "states", "camera": [2.55, -3.65, 2.45], "look_at": [0, 0, 0.93], "ortho": 2.75, "state": "aim"}, {"id": "11-lower", "title": "02 / Hạ càng", "group": "states", "camera": [2.55, -3.65, 2.45], "look_at": [0, 0, 0.93], "ortho": 2.75, "state": "lower"}, {"id": "12-grip", "title": "03 / Khép càng", "group": "states", "camera": [2.55, -3.65, 2.45], "look_at": [0, 0, 0.93], "ortho": 2.75, "state": "grip"}, {"id": "13-lift", "title": "04 / Nâng vật phẩm", "group": "states", "camera": [2.55, -3.65, 2.45], "look_at": [0, 0, 0.93], "ortho": 2.75, "state": "lift"}, {"id": "14-return", "title": "05 / Về cửa thả", "group": "states", "camera": [2.55, -3.65, 2.45], "look_at": [0, 0, 0.93], "ortho": 2.75, "state": "return"}, {"id": "15-release", "title": "06 / Thả vật phẩm", "group": "states", "camera": [2.55, -3.65, 2.45], "look_at": [0, 0, 0.93], "ortho": 2.75, "state": "release"}, {"id": "16-result", "title": "07 / Đến khay nhận", "group": "states", "camera": [1.55, -3.65, 1.6], "look_at": [-0.1, -0.1, 0.8], "ortho": 2.4, "state": "result"}, {"id": "17-materials", "title": "Vật liệu / cùng bảng màu", "group": "materials", "camera": [1.7, -3.3, 1.6], "look_at": [0, 0, 0.45], "ortho": 1.25, "state": "idle", "materials_board": true}], "invariants": ["All images are rendered from one master Blender scene generated from this file.", "Changing camera, visibility or state must not recreate assets or alter material identity.", "All eight prize instances share mesh datablocks and material IDs; no species/face/accessory substitution.", "The carried and delivered prize is prize_03 itself, never a duplicate or substitute.", "Exactly three fingers at 120 degrees; every state changes joint transforms only.", "Orthographic views use one common scale except explicitly labelled top/detail shots.", "Rendering is proposed Blender look-development, not evidence of an implemented OpenGL renderer.", "Open-angle is -22 degrees; evaluated mesh envelope at 32 sampled extreme-travel poses must stay inside the glass and above the floor."]}</script><script>const D=JSON.parse(document.querySelector('#design-data').textContent);
let current=0;
function selectShot(index){current=(index+D.shots.length)%D.shots.length;const s=D.shots[current];document.querySelector('#stageImage').src='renders/'+s.id+'.png';document.querySelector('#stageImage').alt=s.title;document.querySelector('#poseLabel').textContent=s.title;document.querySelectorAll('.controls button').forEach(b=>b.classList.toggle('active',Number(b.dataset.shot)===current));}
const presets={hero:'01-hero',front:'02-front',side:'03-side',top:'05-top',claw:'08-claw-grip'};Object.entries(presets).forEach(([id,shot])=>{const b=document.getElementById(id);b.dataset.shot=D.shots.findIndex(s=>s.id===shot);b.onclick=()=>selectShot(Number(b.dataset.shot));});document.querySelector('#previous').onclick=()=>selectShot(current-1);document.querySelector('#next').onclick=()=>selectShot(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();selectShot(current-1);}if(e.key==='ArrowRight'){e.preventDefault();selectShot(current+1);}});selectShot(0);
